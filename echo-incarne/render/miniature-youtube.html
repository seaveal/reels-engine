<!doctype html>
<meta charset="utf-8">
<title>Miniature YouTube — signature H3C</title>
<!--
  Gabarit de miniature YouTube, 1280×720.

  Pourquoi composer le texte ICI plutôt que de le faire générer avec l'image : un modèle
  d'image rend « une grasse condensée », jamais Anton. Il place le texte où il veut, à la
  taille qu'il veut, et recommence différemment à chaque vignette. Une signature de chaîne
  suppose l'inverse — la même police, la même place, la même barre, sur les 59.

  L'image générée ne porte donc AUCUN texte : elle apporte le visage, l'émotion, la
  lumière. Tout le lettrage vient de ce gabarit, avec les polices embarquées de
  « L'Écho Incarné » (Anton, Archivo) et sa palette. Même identité que les réels et les
  carrousels : une chaîne ne se reconnaît pas si chaque canal a sa typographie.

  Les valeurs sont injectées par `render-miniature.mjs` :
    __IMAGE__  chemin de fond          __TITRE__  lettrage principal
    __ACCENT__ mots forts surlignés en jaune (facultatif, plusieurs séparés par « | »)
-->
<link rel="stylesheet" href="../fonts/echo-incarne-fonts.css">
<style>
  :root {
    --terra: #A8432B;      /* accent canonique H3C, identique aux CTA et aux carrousels */
    /* Le jaune n'est PAS une seconde couleur de marque : c'est un surligneur.
       Le terracotta sur fond sombre plafonne à 2,5:1 de contraste — sur une vignette
       vue à la largeur d'un pouce, le mot accentué disparaissait au lieu de ressortir
       (constat Cyrille, 2026-08-18). Ce jaune monte à 15:1 sur le même voile. Il ne
       sert qu'aux mots forts du titre et à la signature ; la barre reste terracotta,
       et c'est elle qui porte l'identité. */
    --jaune: #FFD400;
    --encre: #2A211A;
    --creme: #F0E7D6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--encre); }

  .scene { position: relative; width: 1280px; height: 720px; }
  .fond  { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* Voile porté à gauche : le lettrage doit tenir même si l'image y est claire.
     Dégradé plutôt qu'aplat, sinon la bordure du voile se voit comme une couture. */
  .voile {
    position: absolute; inset: 0;
    background: linear-gradient(100deg,
      rgba(16,12,10,.94) 0%, rgba(16,12,10,.90) 34%,
      rgba(16,12,10,.55) 50%, rgba(16,12,10,0) 66%);
  }

  .bloc {
    position: absolute; left: 58px; top: 50%; transform: translateY(-50%);
    /* Bloc élargi : à 620 px le lettrage se réduisait trop vite sur les titres longs.
       Une miniature se lit à ~168 px de large — tout ce qui n'est pas énorme disparaît. */
    width: 720px;
  }

  /* Anton, capitales, interlignage serré : c'est ce qui reste lisible à la largeur d'un
     pouce, la seule contrainte qui compte vraiment sur une miniature. */
  .titre {
    font-family: 'Anton', sans-serif;
    /* Interlignage à .96 et non .86 : Anton a des capitales très hautes, et à 172 px
       les lignes se touchaient presque (retour Cyrille, 2026-08-17). L'air entre les
       lignes fait partie de la lisibilité — un pavé compact se lit moins bien qu'un
       pavé un peu plus petit qui respire. L'ajustement en hauteur s'en charge ensuite. */
    font-size: 172px; line-height: .96; letter-spacing: -2px;
    color: #fff; text-transform: uppercase;
    text-shadow: 0 4px 28px rgba(0,0,0,.55);
  }
  /* Une PHRASE par bloc — la coupe naturelle laissait « 17 QUESTIONS. 9 » puis
     « MINUTES. », avec un chiffre orphelin. Le sens porte la coupe.
     Mais la phrase, elle, peut se replier sur plusieurs lignes : interdire le repli
     obligeait à réduire le corps dès qu'un titre était long, et un lettrage réduit ne
     se lit plus à la largeur d'un pouce. Mieux vaut trois lignes énormes qu'une ligne
     petite (retour Cyrille, 2026-08-17). */
  .ligne { display: block; }
  .titre .accent { color: var(--jaune); }

  /* Barre de signature : le seul élément purement graphique, identique partout. */
  .barre {
    width: 150px; height: 14px; background: var(--terra);
    margin-bottom: 28px; border-radius: 2px;
  }

  /* Le nom, présent sur TOUTES les vignettes — c'est la demande qui a lancé ce gabarit.
     Discret par construction : il signe, il ne concurrence pas le titre. */
  .signature {
    position: absolute; left: 58px; bottom: 46px;
    /* Le nom doit se LIRE à la largeur d'un pouce : à 21 px il disparaissait purement
       et simplement (retour Cyrille 2026-08-17). Une signature qu'on ne voit pas ne
       signe rien. Archivo 900, corps doublé, contre-filet pour tenir sur toute image. */
    font-family: 'Archivo', sans-serif; font-weight: 900;
    font-size: 40px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--creme); opacity: 1;
    text-shadow: 0 3px 18px rgba(0,0,0,.75);
  }
  .signature em { font-style: normal; color: var(--jaune); }
</style>

<div class="scene">
  <img class="fond" src="__IMAGE__" alt="">
  <div class="voile"></div>
  <div class="bloc">
    <div class="barre"></div>
    <div class="titre">__TITRE__</div>
  </div>
  <div class="signature">Cyrille <em>Novou</em></div>
</div>
