<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Écho Incarné — page de rendu (headless)</title>
<link href="../fonts/echo-incarne-fonts.css" rel="stylesheet"><!-- polices vendorées (audit 2026-07-07), plus de dépendance réseau -->
<style>
  /* L'Écho Incarné — 3 voix chromatiques SEULEMENT */
  :root{
    --creme:#F0E7D6; --cremeDeep:#E8DCC7; --taupe:#998A79; --terra:#A8432B;
    --encre:#2A211A; --encreSoft:#4A4036; --encreMuted:#6A5F51;
    --serif:'Cormorant Garamond',serif; --sans:'Archivo',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#8a8378;}
  /* La slide à sa VRAIE taille — pas de scale. Dimensions injectées par le script. */
  #stage{width:1080px;height:1440px;background:var(--creme);padding:96px;
         display:flex;flex-direction:column;overflow:hidden;position:relative;}
  #stage.center{align-items:center;text-align:center;}
  .between{justify-content:space-between;}
  .row{display:flex;justify-content:space-between;align-items:flex-start;}
  .eyebrow{font-family:var(--sans);font-size:26px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:var(--taupe);}
  .mono{font-family:var(--mono);font-size:24px;}
  .num{color:var(--taupe);margin-top:16px;}
  .pilier{font-family:var(--mono);font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);margin-bottom:44px;}
  .hook{font-family:var(--serif);color:var(--encre);}
  .hook.cover{font-size:104px;line-height:1.02;letter-spacing:-.015em;}
  .hook.body{font-size:72px;line-height:1.16;letter-spacing:-.01em;}
  .hook.cta{font-size:82px;line-height:1.08;}
  .sub{font-size:44px;line-height:1.4;color:var(--encreSoft);margin-top:44px;}
  .sub.italic{font-family:var(--serif);font-style:italic;font-size:48px;color:var(--encreSoft);margin-top:36px;}
  .pivot{color:var(--terra);font-style:italic;}
  .echo{display:flex;gap:22px;align-items:center;margin-bottom:64px;}
  .echo span{width:46px;height:46px;border-radius:50%;}
  .rule{border-top:1px solid rgba(42,33,26,.28);padding-top:26px;display:flex;justify-content:space-between;align-items:center;}
  .muted{color:var(--encreMuted);}
  .tag{font-family:var(--sans);font-size:22px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--taupe);}
  .legend{font-family:var(--mono);font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:var(--terra);}
  /* Pastille photo — anneau terracotta + liseré crème */
  .pastille{border-radius:50%;background:var(--terra);flex:none;}
  .pastille .ring{width:100%;height:100%;border-radius:50%;background:var(--creme);}
  .pastille .clip{width:100%;height:100%;border-radius:50%;overflow:hidden;}
  .pastille img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.02);display:block;}
</style>
</head>
<body>
  <div id="stage"></div>

<script>
// ------------------------------------------------------------------ helpers
const DEFAULT_PHOTO = '../uploads/cyrille-novou-new-ok.jpg';
const esc = (s='') => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// [[mot]] -> présence terracotta italique (l'unique voix qui bascule)
// esc -> [[surlignage]] -> saut de ligne éditeur (\n) = <br> (Cyrille 2026-07-07 :
// un retour à la ligne tapé dans l'éditeur doit apparaître au rendu ; runs de \n collapsés
// en UN seul <br>, espaces autour retirés).
const pivot = (s='') => esc(s)
  .replace(/\[\[([^\]]+)\]\]/g, '<span class="pivot">$1</span>')
  .replace(/[ \t]*\n(?:[ \t]*\n)*[ \t]*/g, '<br>');
// Eyebrow de marque (Cyrille 2026-07-07) : l'URL du site, SOUVERAIN + QUOTIDIEN en
// terracotta. HTML brut (non échappé) — le handle @lecorpsnetrichejamais reste en pied.
const BRAND_EYEBROW = '<span style="color:var(--terra)">SOUVERAIN</span>AU<span style="color:var(--terra)">QUOTIDIEN</span>.COM';
const eyebrowHtml = (v) => v ? esc(v) : BRAND_EYEBROW;
const num = (i, t) => String(i ?? 1).padStart(2,'0') + ' / ' + String(t ?? 9).padStart(2,'0');
const pastille = (size, photo) => {
  const pad1 = Math.round(size*0.045), pad2 = Math.round(size*0.035);
  return `<div class="pastille" style="width:${size}px;height:${size}px;padding:${pad1}px">
    <div class="ring" style="padding:${pad2}px"><div class="clip"><img src="${photo||DEFAULT_PHOTO}"></div></div></div>`;
};
const ECHO = [0.08,0.16,0.30,0.52];
const echoDots = () => `<div class="echo">
  ${ECHO.map(o=>`<span style="background:var(--encre);opacity:${o}"></span>`).join('')}
  <span style="background:#8C6A4A;opacity:.8"></span>
  <span style="background:var(--terra)"></span></div>`;

// ------------------------------------------------------------------ variantes
function buildCover(s){
  return `<div class="row">
    <div><div class="eyebrow">${eyebrowHtml(s.eyebrow)}</div>
         <div class="mono num">${num(s.index,s.total)}</div></div>
    ${pastille(200, s.photo)}
  </div>
  <div>
    ${s.pilier?`<div class="pilier">${esc(s.pilier)}</div>`:''}
    <div class="hook cover">${pivot(s.text)}</div>
  </div>
  <div>${echoDots()}
    <div class="rule"><span class="mono muted">${esc(s.handle||'@lecorpsnetrichejamais')}</span>
      <span class="tag">H3C</span></div>
  </div>`;
}
function buildBody(s){
  return `<div class="row">
    <span class="eyebrow">${esc(s.eyebrow||'Le signe')}</span>
    <span class="mono" style="color:var(--taupe)">${num(s.index,s.total)}</span>
  </div>
  <div class="hook body">${pivot(s.text)}
    ${s.sub?`<div class="sub">${pivot(s.sub)}</div>`:''}
  </div>
  <div class="rule"><span class="mono muted">${esc(s.handle||'·—·—·—·—·—·—·')}</span>
    <span class="tag">Suite →</span></div>`;
}
function buildCta(s){
  return `<span class="eyebrow" style="align-self:stretch">${eyebrowHtml(s.eyebrow)}</span>
  <div>
    <div style="margin-bottom:56px">${pastille(206, s.photo)}</div>
    <div class="hook cta">${pivot(s.text)}</div>
    ${s.sub?`<div class="sub italic">${pivot(s.sub)}</div>`:''}
  </div>
  <div class="legend">${esc(s.legend||'La réponse est en légende')}</div>`;
}
const BUILDERS = {cover:buildCover, body:buildBody, cta:buildCta};

// ------------------------------------------------------------------ API rendu
// Appelée par Playwright entre deux captures. Renvoie true quand la slide est posée.
window.renderSlide = function(data){
  const stage = document.getElementById('stage');
  const variant = data.variant || 'body';
  stage.className = 'between' + (variant==='cta' ? ' center' : '');
  stage.innerHTML = (BUILDERS[variant]||buildBody)(data);
  return true;
};

// Aperçu par défaut si ouvert à la main (?d=<json base64> possible)
(function(){
  const p = new URLSearchParams(location.search).get('d');
  if(p){ try{ window.renderSlide(JSON.parse(decodeURIComponent(escape(atob(p))))); return; }catch(e){} }
  window.renderSlide({variant:'cover', pilier:'Le mécanisme',
    text:"Une femme qui tolère l'insupportable a été [[dressée]].",
    index:1, total:9, handle:'@lecorpsnetrichejamais'});
})();
</script>
</body>
</html>
