<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>H3C — Moteur carrousel « La Braise » (headless)</title>
<!--
  CARROUSEL — DIRECTION A « LA BRAISE » (harmonisé avec moteurs/moteur-braise.html)
  Images fixes 1080×1440 (4:5 utile = 1350px du haut ; couverture lisible dans le
  carré central 1080×1080). Aucune animation. Interface : window.renderSlide(data).
  data = { variant:'cover'|'body'|'cta', text, sub?, pilier?, legend?, eyebrow?,
           index?, total?, handle?, photo?, theme? } — [[mot]] parsé, \n\n = respiration.
  Aperçu : ?d=<data b64> ou ?demo=cover|body|cta &theme=papier &guides=1 (repères 4:5 + carré).
  PROD : vendorer Anton, Cormorant Garamond, IBM Plex Mono en @font-face locales.
-->
<link href="../fonts/echo-incarne-fonts.css" rel="stylesheet"><!-- polices vendorées 2026-07-16 (offline) -->
<style>
  :root{--sans:'Anton',sans-serif;--serif:'Cormorant Garamond',serif;--mono:'IBM Plex Mono',monospace;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#000;}
  #stage{width:1080px;height:1440px;position:relative;overflow:hidden;}
  .souffle{display:block;height:.55em;}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const THEMES={
  braise:{bg:'#17100A',text:'#F2E8D7',dim:'rgba(242,232,215,.52)',accent:'#E0653A',glow:'rgba(168,67,43,.5)',grainOp:.14,gb:'soft-light'},
  papier:{bg:'#EFE5D2',text:'#241A12',dim:'rgba(36,26,18,.5)',accent:'#A8432B',glow:'rgba(255,246,230,.9)',grainOp:.09,gb:'multiply'},
};
const PHOTO='../uploads/cyrille-novou-new-ok.jpg';
const IGRING='conic-gradient(from 210deg, #FEDA75, #FA7E1E, #D62976, #962FBF, #4F5BD5, #FEDA75)';
const GRAIN='data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22180%22%20height=%22180%22%3E%3Cfilter%20id=%22n%22%3E%3CfeTurbulence%20type=%22fractalNoise%22%20baseFrequency=%220.85%22%20numOctaves=%222%22%20stitchTiles=%22stitch%22%2F%3E%3C%2Ffilter%3E%3Crect%20width=%22100%25%22%20height=%22100%25%22%20filter=%22url%28%23n%29%22%2F%3E%3C%2Fsvg%3E';
const esc=(s='')=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// [[mot]] -> serif italique terracotta ; \n\n = respiration, \n = <br>
const pivot=(s,T)=>esc(s)
  .replace(/\[\[([^\]]+)\]\]/g,`<span style="font-family:var(--serif);font-style:italic;font-weight:600;color:${T.accent}">$1</span>`)
  .replace(/[ \t]*\n(?:[ \t]*\n)+[ \t]*/g,'<span class="souffle"></span>')
  .replace(/[ \t]*\n[ \t]*/g,'<br>');
const num=(i,t)=>String(i??1).padStart(2,'0')+' / '+String(t??9).padStart(2,'0');
const pastille=(size,photo,T)=>`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${IGRING};padding:5px;flex:none;"><div style="width:100%;height:100%;border-radius:50%;background:${T.bg};padding:3px;"><img src="${photo||PHOTO}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;filter:grayscale(1) contrast(1.02);display:block;"></div></div>`;

function buildCover(s,T){
  return `<div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:28px;">${pastille(122,s.photo,T)}
      <div style="font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:${T.text};">@le<span style="color:${T.accent}">corps</span>ne<span style="color:${T.accent}">triche</span>jamais</div></div>
    <div style="font-family:var(--mono);font-size:24px;color:${T.dim};">${num(s.index,s.total)}</div></div>
  <div>
    ${s.pilier?`<div style="font-family:var(--mono);font-size:25px;letter-spacing:.2em;text-transform:uppercase;color:${T.accent};margin-bottom:40px;">${esc(s.pilier)}</div>`:''}
    <div style="width:140px;height:12px;background:${T.accent};margin-bottom:44px;"></div>
    <div class="fitT" style="font-family:var(--sans);font-size:112px;line-height:1.0;letter-spacing:.01em;text-transform:uppercase;color:${T.text};">${pivot(s.text||'',T)}</div>
  </div>
  <div style="border-top:1px solid ${T.dim};padding-top:26px;display:flex;justify-content:space-between;align-items:center;">
    <span style="font-family:var(--mono);font-size:24px;letter-spacing:.14em;color:${T.dim};">SOUVERAINAUQUOTIDIEN.COM</span>
    <span style="font-family:var(--mono);font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:${T.accent};">H3C</span></div>`;
}
function buildBody(s,T){
  return `<div style="display:flex;justify-content:space-between;align-items:baseline;">
    <span style="font-family:var(--mono);font-size:25px;letter-spacing:.2em;text-transform:uppercase;color:${T.accent};">${esc(s.eyebrow||'LE SIGNE')}</span>
    <span style="font-family:var(--mono);font-size:24px;color:${T.dim};">${num(s.index,s.total)}</span></div>
  <div>
    <div class="fitT" style="font-family:var(--sans);font-size:86px;line-height:1.06;letter-spacing:.01em;text-transform:uppercase;color:${T.text};">${pivot(s.text||'',T)}</div>
    ${s.sub?`<div class="fitS" style="font-family:var(--serif);font-size:46px;line-height:1.35;color:${T.dim};margin-top:44px;">${pivot(s.sub,T)}</div>`:''}
  </div>
  <div style="border-top:1px solid ${T.dim};padding-top:26px;display:flex;justify-content:space-between;align-items:center;">
    <span style="font-family:var(--mono);font-size:24px;letter-spacing:.14em;color:${T.dim};">${esc(s.handle||'·—·—·—·—·—·—·')}</span>
    <span style="font-family:var(--mono);font-size:23px;letter-spacing:.22em;text-transform:uppercase;color:${T.accent};">SUITE →</span></div>`;
}
function buildCta(s,T){
  return `<div style="display:flex;justify-content:center;">${pastille(186,s.photo,T)}</div>
  <div style="text-align:center;">
    <div class="fitT" style="font-family:var(--sans);font-size:94px;line-height:1.0;letter-spacing:.01em;text-transform:uppercase;color:${T.text};">${pivot(s.text||'',T)}</div>
    ${s.sub?`<div class="fitS" style="font-family:var(--serif);font-style:italic;font-size:48px;line-height:1.3;color:${T.dim};margin-top:44px;">${pivot(s.sub,T)}</div>`:''}
  </div>
  <div style="text-align:center;font-family:var(--mono);font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:${T.accent};">${esc(s.legend||'La réponse est en légende')}</div>`;
}
const BUILDERS={cover:buildCover,body:buildBody,cta:buildCta};

window.renderSlide=function(data){
  const d=data||{};
  const T=THEMES[d.theme==='papier'?'papier':'braise'];
  const v=d.variant||'body';
  const stage=document.getElementById('stage');
  stage.innerHTML=`
    <div style="position:absolute;inset:0;background:${T.bg}"></div>
    <div style="position:absolute;inset:-25%;background:radial-gradient(circle at 50% 80%, ${T.glow}, transparent 58%);"></div>
    <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 34%, transparent 55%, rgba(0,0,0,.24));"></div>
    <div style="position:absolute;inset:-10%;background-image:url(${GRAIN});background-size:190px 190px;opacity:${T.grainOp};mix-blend-mode:${T.gb};"></div>
    <div id="content" style="position:absolute;inset:0;padding:96px;display:flex;flex-direction:column;justify-content:space-between;${v==='cta'?'align-items:center;':''}color:${T.text};">${(BUILDERS[v]||buildBody)(d,T)}</div>
    ${d.guides?`<div style="position:absolute;inset:0;pointer-events:none;font-family:var(--mono);color:rgba(255,84,60,.9);">
      <div style="position:absolute;left:0;right:0;top:1350px;border-top:2px dashed rgba(255,84,60,.7)"></div>
      <div style="position:absolute;left:0;right:0;top:180px;border-top:2px dashed rgba(255,220,90,.6)"></div>
      <div style="position:absolute;left:0;right:0;top:1260px;border-top:2px dashed rgba(255,220,90,.6)"></div>
      <div style="position:absolute;top:1356px;left:24px;font-size:22px;">coupe feed 4:5</div>
      <div style="position:absolute;top:186px;left:24px;font-size:22px;color:rgba(255,220,90,.9);">carré profil 1080²</div>
    </div>`:''}`;
  // auto-fit : rétrécit tête (et sous-texte) tant que ça déborde du stage
  const c=document.getElementById('content');
  let guard=0;
  while(c.scrollHeight>c.clientHeight&&guard++<60){
    ['.fitT','.fitS'].forEach(sel=>{const el=c.querySelector(sel);if(el){const fs=parseFloat(getComputedStyle(el).fontSize);if(fs>34)el.style.fontSize=(fs-4)+'px';}});
  }
  return true;
};

// Aperçu manuel
const DEMOS={
  cover:{variant:'cover',pilier:'Le mécanisme',text:"VOUS CROYEZ QUE VOUS L'AIMEZ, LUI. EN VÉRITÉ, VOUS AIMEZ LA [[BLESSURE]] QU'IL RÉVEILLE.",index:1,total:10},
  body:{variant:'body',text:'UN HOMME PRÉSENT, STABLE, DISPONIBLE, ET VOUS VOUS [[ENNUYEZ]].',sub:"VOUS APPELEZ ÇA « PAS D'ALCHIMIE ».",index:3,total:10},
  cta:{variant:'cta',text:'LA TÊTE COMPREND TOUT ÇA. LE CORPS, LUI, RÉPARE.',sub:'LA PREMIÈRE MARCHE VOUS ATTEND EN [[LÉGENDE]].',legend:'La réponse est en légende',index:10,total:10},
};
(function(){
  const q=new URLSearchParams(location.search);
  let d=null;
  try{if(q.get('d'))d=JSON.parse(decodeURIComponent(escape(atob(q.get('d')))));}catch(e){}
  d=d||Object.assign({},DEMOS[q.get('demo')||'cover']||DEMOS.cover);
  if(q.get('theme'))d.theme=q.get('theme');
  if(q.get('guides')==='1')d.guides=true;
  window.renderSlide(d);
})();
</script>
</body>
</html>
