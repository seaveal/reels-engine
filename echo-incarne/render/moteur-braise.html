<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>H3C — Moteur réel « La Braise » (headless)</title>
<!--
  DIRECTION A — « LA BRAISE »
  Nuit incandescente. Fond encre chaude, halo de braise terracotta, grain.
  Typo affiche ultra-condensée (Anton) pour l'arrêt du pouce ; les [[pivots]]
  basculent en serif italique terracotta (ADN Écho Incarné). Coupes sèches,
  punch-in bref — grammaire d'animation nerveuse, jamais criarde.
  Contrat : window.loadReel(spec, opts) / await window.playReel() /
  window.reelDurationMs(spec) / window.renderSlide(data) (image 1080×1350).
  Aperçu manuel : ?d=<spec b64> ou ?demo=court|long|message|confrontation|
  avantapres|timeline|liste|citation|carte &platform= &theme=papier|nuit &guides=1 &norun=1
  PROD : vendorer Anton, Cormorant Garamond, IBM Plex Mono en @font-face locales
  (remplacer le <link> Google Fonts ci-dessous — aperçu seulement).
-->
<link href="../fonts/echo-incarne-fonts.css" rel="stylesheet"><!-- polices vendorées 2026-07-16 (offline) -->
<style>
  :root{--sans:'Anton',sans-serif;--serif:'Cormorant Garamond',serif;--mono:'IBM Plex Mono',monospace;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#000;}
  #stage{width:1080px;height:1920px;position:relative;overflow:hidden;}
  @keyframes brGlow{0%{transform:translate(-6%,5%) scale(1.12);}50%{transform:translate(6%,-4%) scale(1.32);}100%{transform:translate(-6%,5%) scale(1.12);}}
  @keyframes brGrain{0%{transform:translate(0,0);}100%{transform:translate(-7%,5%);}}
  @keyframes brPunch{0%{opacity:0;transform:scale(1.06) translateY(12px);}55%{opacity:1;}100%{opacity:1;transform:scale(1) translateY(0);}}
  @keyframes brBar{0%{transform:scaleX(0);}100%{transform:scaleX(1);}}
  @keyframes brRise{0%{opacity:0;transform:translateY(26px);}100%{opacity:1;transform:translateY(0);}}
  @keyframes brTdot{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-7px);}}
  .tdot{width:16px;height:16px;border-radius:50%;background:#F5EDDD;display:inline-block;animation:brTdot 1s infinite;}
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ============================================================ constantes
const THEMES = {
  braise:{bg:'#17100A',text:'#F2E8D7',dim:'rgba(242,232,215,.52)',accent:'#E0653A',deep:'#A8432B',glow:'rgba(168,67,43,.55)',echo:'rgba(224,101,58,.14)',grainOp:.15,gb:'soft-light',bubbleIn:'#393026',capText:'#F7EEDD'},
  papier:{bg:'#EFE5D2',text:'#241A12',dim:'rgba(36,26,18,.5)',accent:'#A8432B',deep:'#8F3722',glow:'rgba(255,246,230,.9)',echo:'rgba(168,67,43,.12)',grainOp:.09,gb:'multiply',bubbleIn:'#5E5449',capText:'#F7EEDD'},
};
const PLATFORMS = {
  instagram:{top:280,right:180,bottom:550,left:104,ctaAlign:'flex-end',arrow:'down-left',cta:"D'où ça vient — en légende",label:'Instagram Reels'},
  tiktok:{top:280,right:184,bottom:560,left:104,ctaAlign:'flex-start',arrow:'down-left',cta:"D'où ça vient — en légende",label:'TikTok'},
  youtube:{top:300,right:212,bottom:530,left:104,ctaAlign:'flex-end',arrow:'up-right',cta:"D'où ça vient — en description",label:'YouTube Shorts'},
};
const GRAIN='data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22180%22%20height=%22180%22%3E%3Cfilter%20id=%22n%22%3E%3CfeTurbulence%20type=%22fractalNoise%22%20baseFrequency=%220.85%22%20numOctaves=%222%22%20stitchTiles=%22stitch%22%2F%3E%3C%2Ffilter%3E%3Crect%20width=%22100%25%22%20height=%22100%25%22%20filter=%22url%28%23n%29%22%2F%3E%3C%2Fsvg%3E';
const PHOTO='../uploads/cyrille-novou-new-ok.jpg'; // pastille profil (même convention que la prod)
const esc=(s='')=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pivot=(s,T)=>esc(s).replace(/\[\[([^\]]+)\]\]/g,`<span style="font-family:var(--serif);font-style:italic;font-weight:600;color:${T.accent}">$1</span>`);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
// Durée d'affichage = f(nombre de caractères) : chars/27, plancher 2 s (readabilité mini), plafond 26 s.
// Plancher abaissé 4→2 s le 2026-07-17 (Cyrille) : à 4 s la plupart des pages courtes s'y collaient → la durée ne variait plus avec le texte.
const holdMs=seg=>Math.min(26,Math.max(2,seg.text.replace(/\[\[|\]\]/g,'').length/27))*1000;
// Révélation dans l'ordre de lecture : gaps entre lignes configurables par le
// serveur — seg.line_delays_ms[] (par ligne) ou line_delay_ms (uniforme),
// posables au niveau du segment ou du spec. Défaut 450 ms.
const lineGaps=(seg,spec,n)=>{
  const arr=seg.line_delays_ms||spec.line_delays_ms;
  const uni=(seg.line_delay_ms!=null?seg.line_delay_ms:(spec.line_delay_ms!=null?spec.line_delay_ms:450));
  return Array.from({length:Math.max(0,n-1)},(_,i)=>Array.isArray(arr)?(arr[i]!=null?arr[i]:uni):uni);
};
const segLines=(text,T)=>String(text).split('\n').filter(l=>l.trim()).map(l=>`<div class="segLine" style="opacity:0;transform:translateY(16px);transition:opacity 0.4s ease,transform 0.4s ease;">${pivot(l,T)}</div>`).join('');
const readMs=(t,div,lo,hi)=>Math.min(hi,Math.max(lo,String(t||'').length/div*1000));
const msgReadMs=t=>Math.min(4200,Math.max(1300,String(t).length/22*1000));
const cfReadMs=spec=>Math.min(5200,Math.max(2600,String((spec.bottom||{}).text||'').length/20*1000));
const MSG_TYPING_MS=650;
let CFG=null;

// Adaptateur schéma vault : { pages:[{lines:[{text,role}],arrow}] } -> { segments }
function adaptSpec(spec){
  if(!spec.segments&&Array.isArray(spec.pages)){
    spec.segments=spec.pages.map((p,i)=>{
      const lines=(p.lines||[]).filter(l=>String(l.text||'').trim());
      const isCta=lines.some(l=>String(l.role||'').toLowerCase()==='cta');
      const isHeading=lines.every(l=>String(l.role||'').toLowerCase()==='heading');
      return{role:isCta?'cta':(i===0&&isHeading?'title':'block'),text:lines.map(l=>String(l.text)).join('\n')};
    }).filter(s=>s.text);
  }
  return spec;
}

// ============================================================ mise en place
window.loadReel=function(spec,opts={}){
  spec=adaptSpec(spec);
  const T=THEMES[opts.theme==='papier'?'papier':'braise'];
  const Z=PLATFORMS[opts.platform||'instagram']||PLATFORMS.instagram;
  CFG={spec,T,Z,guides:!!opts.guides};
  const ctaSeg=(spec.segments||[]).find(s=>s.role==='cta');
  let ctaLabel=spec.cta?String(spec.cta).replace(/^\s*\(|\)\s*$/g,'').replace(/\[\[|\]\]/g,'')
    :(ctaSeg?ctaSeg.text.replace(/^\s*\(|\)\s*$/g,'').replace(/\[\[|\]\]/g,''):Z.cta);
  if((opts.platform||'instagram')==='youtube') ctaLabel=ctaLabel.replace(/l[ée]gende/gi,'DESCRIPTION');
  const stage=document.getElementById('stage');
  stage.style.height='1920px';
  stage.innerHTML=`
    <div style="position:absolute;inset:0;background:${T.bg}"></div>
    <div style="position:absolute;inset:-25%;background:radial-gradient(circle at 50% 78%, ${T.glow}, transparent 58%);animation:brGlow 22s ease-in-out infinite;"></div>
    <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 30%, transparent 55%, rgba(0,0,0,.28));"></div>
    <div style="position:absolute;inset:-10%;background-image:url(${GRAIN});background-size:190px 190px;opacity:${T.grainOp};mix-blend-mode:${T.gb};animation:brGrain 7s steps(6) infinite;pointer-events:none;"></div>
    <div style="position:absolute;inset:0;padding:${Z.top}px ${Z.right}px ${Z.bottom}px ${Z.left}px;display:flex;flex-direction:column;justify-content:space-between;color:${T.text};">
      <div style="display:flex;align-items:center;gap:30px;animation:brRise .9s ease both;">
        <div style="width:116px;height:116px;border-radius:50%;background:conic-gradient(from 210deg, #FEDA75, #FA7E1E, #D62976, #962FBF, #4F5BD5, #FEDA75);padding:5px;flex:none;">
          <div style="width:100%;height:100%;border-radius:50%;background:${T.bg};padding:3px;">
            <img src="${PHOTO}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;filter:grayscale(1) contrast(1.02);display:block;">
          </div>
        </div>
        <div style="font-family:var(--mono);font-size:33px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:${T.text};">@le<span style="color:${T.accent}">corps</span>ne<span style="color:${T.accent}">triche</span>jamais</div>
      </div>
      <div id="page" style="min-height:640px;display:flex;flex-direction:column;justify-content:center;"></div>
      <div id="ctaRow" style="display:flex;align-items:flex-start;justify-content:${Z.ctaAlign};gap:34px;opacity:0;transform:translateY(36px);transition:opacity .55s ease,transform .55s ease;">
        ${Z.arrow==='up-right'?'':`<div style="font-size:70px;line-height:1;color:${T.accent};transform:translateY(46px);">↓</div>`}
        <div id="ctaCapsule" style="display:inline-flex;align-items:center;background:${T.accent};color:${T.capText};border-radius:6px;padding:30px 48px;font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;box-shadow:0 14px 44px rgba(0,0,0,.35);">${esc(ctaLabel)}</div>
        ${Z.arrow==='up-right'?`<div style="font-size:70px;line-height:1;color:${T.accent};transform:translateY(-44px);">↑</div>`:''}
      </div>
    </div>
    ${CFG.guides?guidesHtml(Z):''}`;
  fitCapsule(Z);
  const B={message:buildMessage,confrontation:buildConfrontation,avantapres:buildAvantApres,timeline:buildTimeline,liste:buildListe,citation:buildCitation,notes:buildNotes,calendrier:buildCalendrier,page:buildPage,audio:buildAudio}[spec.layout];
  if(B) B(spec,T);
  return true;
};
function guidesHtml(Z){
  return `<div style="position:absolute;inset:0;pointer-events:none;font-family:var(--mono);color:rgba(255,84,60,.85);">
    <div style="position:absolute;left:0;right:0;top:${Z.top-30}px;border-top:2px dashed rgba(255,84,60,.6)"></div>
    <div style="position:absolute;left:0;right:0;bottom:${Z.bottom-30}px;border-top:2px dashed rgba(255,84,60,.6)"></div>
    <div style="position:absolute;top:${Z.top-30}px;bottom:${Z.bottom-30}px;right:${Z.right-20}px;border-right:2px dashed rgba(255,84,60,.6)"></div>
    <div style="position:absolute;top:${Z.top-72}px;left:${Z.left}px;font-size:24px;">${Z.label} — safe zone</div>
  </div>`;
}
function fitCapsule(Z){
  const c=document.getElementById('ctaCapsule');
  if(!c)return;
  const zone=1080-Z.left-Z.right-(70+34);
  let fs=34;
  while(c.scrollWidth>zone&&fs>20){fs-=2;c.style.fontSize=fs+'px';}
  if(c.scrollWidth>zone)c.style.letterSpacing='.03em';
  if(c.scrollWidth>zone)c.style.padding='24px 30px';
}
function fitPage(page,sel){
  // Mesure le CONTENU, pas la boîte flex : #page a flex:1, son scrollHeight vaut
  // la hauteur de la zone flex — on neutralise flex/height le temps de la mesure.
  const avail=1920-CFG.Z.top-CFG.Z.bottom-340;
  const pf=page.style.flex,ph=page.style.height,pm=page.style.minHeight;
  page.style.flex='none';page.style.height='auto';page.style.minHeight='0';
  let guard=0;
  while(page.scrollHeight>avail&&guard++<60){
    page.querySelectorAll(sel).forEach(el=>{
      const fs=parseFloat(getComputedStyle(el).fontSize);
      if(fs>36)el.style.fontSize=(fs-4)+'px';
    });
  }
  page.style.flex=pf;page.style.height=ph;page.style.minHeight=pm;
}
function revealCta(){const c=document.getElementById('ctaRow');if(c){c.style.opacity='1';c.style.transform='translateY(0)';}}
function hookHtml(spec,T,fs){
  return spec.hook?`<div style="font-family:var(--sans);font-size:${fs}px;line-height:1.04;letter-spacing:.01em;text-transform:uppercase;color:${T.text};margin-bottom:48px;animation:brPunch .35s ease both;">${pivot(spec.hook,T)}</div>`:'';
}

// ============================================================ format court / long (segments)
function showSegment(i){
  const {spec,T,Z}=CFG;
  const seg=spec.segments[i];
  const isCta=seg.role==='cta';
  const displaySeg=isCta?spec.segments[Math.max(0,i-1)]:seg;
  const isTitle=displaySeg.role==='title';
  const page=document.getElementById('page');
  if(!isCta){
    page.innerHTML=`<div>
      ${isTitle?`<div style="width:140px;height:12px;background:${T.accent};transform-origin:left;animation:brBar .5s .1s ease both;margin-bottom:44px;"></div>`:''}
      <div class="segFit" style="font-family:var(--sans);font-size:${isTitle?136:100}px;line-height:${isTitle?.99:1.07};letter-spacing:.01em;text-transform:uppercase;">${segLines(displaySeg.text,T)}</div>
    </div>`;
    const el=page.querySelector('.segFit');
    const avail=1920-Z.top-Z.bottom-340-(isTitle?56:0);
    let fs=isTitle?136:100;
    while(el.scrollHeight>avail&&fs>44){fs-=4;el.style.fontSize=fs+'px';}
  }
  const cta=document.getElementById('ctaRow');
  cta.style.opacity=isCta?'1':'0';
  cta.style.transform=isCta?'translateY(0)':'translateY(36px)';
}

// ============================================================ confrontation
function buildConfrontation(spec,T){
  const page=document.getElementById('page');
  page.style.flex='1';page.style.minHeight='0';page.style.justifyContent='center';
  const top=spec.top||{},bottom=spec.bottom||{};
  page.innerHTML=hookHtml(spec,T,58)+
    `<div id="cf0" style="opacity:0;transform:translateY(18px);transition:opacity .45s ease,transform .45s ease;">`+
      (top.eyebrow?`<div style="font-family:var(--mono);font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:${T.dim};margin-bottom:16px;">${esc(top.eyebrow)}</div>`:'')+
      `<div class="cfFit" style="font-family:var(--sans);font-size:78px;line-height:1.08;text-transform:uppercase;color:${T.dim};text-decoration:line-through;text-decoration-color:${T.accent};text-decoration-thickness:5px;">${pivot(top.text||'',T)}</div></div>`+
    `<div id="cf1" style="display:flex;align-items:center;gap:24px;margin:44px 0;opacity:0;transition:opacity .4s ease;">
      <div style="flex:1;height:3px;background:${T.text};opacity:.18;"></div>
      <div style="font-family:var(--mono);font-size:30px;letter-spacing:.14em;color:${T.accent};">MAIS</div>
      <div style="flex:1;height:3px;background:${T.text};opacity:.18;"></div></div>`+
    `<div id="cf2" style="opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .5s ease;">`+
      (bottom.eyebrow?`<div style="font-family:var(--mono);font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:${T.accent};margin-bottom:16px;">${esc(bottom.eyebrow)}</div>`:'')+
      `<div class="cfFit" style="font-family:var(--sans);font-size:96px;line-height:1.04;text-transform:uppercase;color:${T.text};">${pivot(bottom.text||'',T)}</div></div>`;
  fitPage(page,'.cfFit');
}
async function playConfrontation(){
  const el=id=>document.getElementById(id);
  await wait(400);
  if(el('cf0')){el('cf0').style.opacity='1';el('cf0').style.transform='none';}
  await wait(2600);
  if(el('cf1'))el('cf1').style.opacity='1';
  await wait(650);
  if(el('cf2')){el('cf2').style.opacity='1';el('cf2').style.transform='none';}
  await wait(cfReadMs(CFG.spec));
  revealCta();await wait(1600);return true;
}

// ============================================================ avant / après
function buildAvantApres(spec,T){
  const page=document.getElementById('page');
  page.style.flex='1';page.style.minHeight='0';page.style.justifyContent='center';
  const a=spec.avant||{},g=spec.geste||{},ap=spec.apres||{};
  page.innerHTML=hookHtml(spec,T,54)+
    `<div id="aa0" style="opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease;">
      <div style="font-family:var(--mono);font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:${T.dim};margin-bottom:14px;">${esc(a.eyebrow||'AVANT')}</div>
      <div class="aaFit" style="font-family:var(--serif);font-size:62px;line-height:1.2;color:${T.dim};">${pivot(a.text||'',T)}</div></div>
    <div id="aa1" style="opacity:0;transform:scale(.96);transition:opacity .4s ease,transform .4s ease;margin:38px 0;padding:30px 36px;border-left:10px solid ${T.accent};background:${T.echo};">
      <div style="font-family:var(--mono);font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:${T.accent};margin-bottom:12px;">LE GESTE</div>
      <div class="aaFit" style="font-family:var(--sans);font-size:56px;line-height:1.14;text-transform:uppercase;letter-spacing:.01em;color:${T.text};">${pivot(g.text||'',T)}</div></div>
    <div id="aa2" style="opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .5s ease;">
      <div style="font-family:var(--mono);font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:${T.accent};margin-bottom:14px;">${esc(ap.eyebrow||'APRÈS')}</div>
      <div class="aaFit" style="font-family:var(--sans);font-size:84px;line-height:1.06;text-transform:uppercase;color:${T.text};">${pivot(ap.text||'',T)}</div></div>`;
  fitPage(page,'.aaFit');
}
async function playAvantApres(){
  const holds=[2400,2600,3000];
  await wait(400);
  for(let i=0;i<3;i++){const el=document.getElementById('aa'+i);if(el){el.style.opacity='1';el.style.transform='none';}await wait(holds[i]);}
  revealCta();await wait(1600);return true;
}

// ============================================================ timeline
function buildTimeline(spec,T){
  const page=document.getElementById('page');
  page.style.flex='1';page.style.minHeight='0';page.style.justifyContent='center';
  const steps=(spec.steps||[]).slice(0,4);
  page.innerHTML=hookHtml(spec,T,54)+`<div style="display:flex;flex-direction:column;">`+
    steps.map((s,i)=>`<div id="tl${i}" style="display:flex;gap:30px;opacity:0;transform:translateY(20px);transition:opacity .45s ease,transform .45s ease;">
      <div style="display:flex;flex-direction:column;align-items:center;">
        <div style="width:24px;height:24px;background:${T.accent};flex:none;margin-top:12px;"></div>
        ${i<steps.length-1?`<div style="width:3px;flex:1;background:${T.accent};opacity:.3;min-height:50px;"></div>`:''}</div>
      <div style="padding-bottom:${i<steps.length-1?'42px':'0'};">
        <div style="font-family:var(--mono);font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:${T.accent};margin-bottom:10px;">${esc(s.label||('ÉTAPE '+(i+1)))}</div>
        <div class="tlFit" style="font-family:var(--serif);font-size:58px;line-height:1.2;font-weight:500;color:${T.text};">${pivot(s.text||'',T)}</div></div></div>`).join('')+`</div>`;
  fitPage(page,'.tlFit');
}
async function playTimeline(){
  const steps=(CFG.spec.steps||[]).slice(0,4);
  await wait(400);
  for(let i=0;i<steps.length;i++){const el=document.getElementById('tl'+i);if(el){el.style.opacity='1';el.style.transform='none';}await wait(readMs(steps[i].text,22,2000,3400));}
  revealCta();await wait(1600);return true;
}

// ============================================================ liste
function buildListe(spec,T){
  const page=document.getElementById('page');
  page.style.flex='1';page.style.minHeight='0';page.style.justifyContent='center';
  const items=(spec.items||[]).slice(0,6);
  page.innerHTML=hookHtml(spec,T,58)+`<div style="display:flex;flex-direction:column;gap:32px;">`+
    items.map((it,i)=>`<div id="li${i}" style="display:flex;gap:28px;align-items:baseline;opacity:0;transform:translateX(-16px);transition:opacity .4s ease,transform .4s ease;">
      <div style="font-family:var(--sans);font-size:62px;color:${T.accent};flex:none;line-height:1;">${i+1}</div>
      <div class="liFit" style="font-family:var(--serif);font-size:56px;font-weight:500;line-height:1.2;color:${T.text};">${pivot(String(it),T)}</div></div>`).join('')+`</div>`;
  fitPage(page,'.liFit');
}
async function playListe(){
  const items=(CFG.spec.items||[]).slice(0,6);
  await wait(500);
  for(let i=0;i<items.length;i++){const el=document.getElementById('li'+i);if(el){el.style.opacity='1';el.style.transform='none';}await wait(readMs(items[i],24,1500,2600));}
  revealCta();await wait(1700);return true;
}

// ============================================================ citation
function buildCitation(spec,T){
  const page=document.getElementById('page');
  page.style.flex='1';page.style.minHeight='0';page.style.justifyContent='center';
  page.innerHTML=
    `<div id="ct0" style="opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease;">
      <div style="width:140px;height:12px;background:${T.accent};margin-bottom:46px;"></div>
      <div class="ctFit" style="font-family:var(--sans);font-size:94px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;color:${T.text};">${pivot(spec.quote||'',T)}</div></div>`+
    (spec.dev?`<div id="ct1" style="opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease;margin-top:44px;font-family:var(--serif);font-style:italic;font-size:48px;line-height:1.3;color:${T.dim};">${pivot(spec.dev,T)}</div>`:'');
  fitPage(page,'.ctFit');
}
async function playCitation(){
  await wait(500);
  const q=document.getElementById('ct0');if(q){q.style.opacity='1';q.style.transform='none';}
  await wait(3400);

// =============================================================== mode extrait audio (dérivé pub T49 — 2026-08-20)
// La voix de Cyrille (muxée par export-reel --audio) + transcription VERBATIM en karaoké calé sur
// l'horloge réelle. Onde déterministe (PRNG graine fixe) : identique à chaque rendu.
function auWave(n) {
  let s = 7; const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const out = []; for (let i = 0; i < n; i++) { const r = rnd(); out.push(18 + Math.pow(Math.sin((i / n) * Math.PI), .6) * (40 + r * 62)); }
  return out;
}
function auFmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function buildAudio(spec, T) {
  const page = document.getElementById('page');
  page.style.flex = '1'; page.style.minHeight = '0'; page.style.justifyContent = 'center';
  const AC = T.accent || T.chip || '#A8432B', EC = T.echo || T.hi || 'rgba(168,67,43,.10)';
  const words = spec.words || [];
  const total = Math.max(1, Number(spec.t1 || 0) - Number(spec.t0 || 0));
  const bars = auWave(58);
  page.innerHTML = hookHtml(spec, T, 42) +
    `<div style="background:${EC};border-radius:30px;padding:44px 46px 40px;">
      <div style="font-family:var(--mono);font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:${AC};margin-bottom:10px;">${esc(spec.kicker || 'Extrait · livre audio')}</div>
      <div style="font-family:var(--sans);font-weight:800;font-size:34px;line-height:1.1;color:${T.text};margin-bottom:30px;">Lu par Cyrille Novou</div>
      <div style="display:flex;align-items:center;gap:26px;margin-bottom:14px;">
        <div id="auPlay" style="flex:none;width:104px;height:104px;border-radius:50%;background:${AC};display:flex;align-items:center;justify-content:center;box-shadow:0 12px 34px rgba(0,0,0,.22);"><div style="width:0;height:0;border-top:20px solid transparent;border-bottom:20px solid transparent;border-left:34px solid #F5EDDD;margin-left:8px;"></div></div>
        <div id="auBars" style="flex:1;display:flex;align-items:center;gap:6px;height:120px;">` +
    bars.map(h => `<div class="auBar" style="flex:1;height:${h.toFixed(0)}px;border-radius:4px;background:${T.text};opacity:.22;transition:opacity .2s,background .2s;"></div>`).join('') +
    `</div></div>
      <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:24px;color:${T.text};opacity:.55;margin-bottom:30px;"><span id="auNow">0:00</span><span>${auFmt(total)}</span></div>
      <div id="auText" class="auFit" style="font-family:var(--serif);font-size:44px;line-height:1.38;color:${T.text};">` +
    words.map((w, i) => `<span class="auW" id="auw${i}" style="opacity:.42;transition:opacity .25s,color .25s;">${esc(w.w)}</span>`).join(' ') +
    `</div></div>`;
  fitPage(page, '.auFit');
}
async function playAudio() {
  const spec = CFG.spec, words = spec.words || [];
  const AC = (CFG.T && (CFG.T.accent || CFG.T.chip)) || '#A8432B';
  const total = Math.max(1, Number(spec.t1 || 0) - Number(spec.t0 || 0)) * 1000;
  const bars = Array.from(document.querySelectorAll('.auBar'));
  await wait(window.AUDIO_LEAD_MS);
  const play = document.getElementById('auPlay'); if (play) play.style.transform = 'scale(.94)';
  const start = performance.now();
  await new Promise(resolve => {
    let cur = -1;
    const tick = () => {
      const el = performance.now() - start;
      const sec = el / 1000;
      let idx = -1;
      for (let i = 0; i < words.length; i++) { if (words[i].t0 <= sec) idx = i; else break; }
      if (idx !== cur) {
        for (let i = Math.max(0, cur); i <= idx; i++) { const w = document.getElementById('auw' + i); if (w) { w.style.opacity = '1'; w.style.color = ''; w.style.fontWeight = ''; } }
        const now = document.getElementById('auw' + idx); if (now) { now.style.color = AC; now.style.fontWeight = '600'; }
        const prev = document.getElementById('auw' + cur); if (prev && cur !== idx) { prev.style.color = ''; prev.style.fontWeight = ''; prev.style.opacity = '.78'; }
        cur = idx;
      }
      const frac = Math.min(1, el / total);
      const lit = Math.floor(frac * bars.length);
      for (let i = 0; i < bars.length; i++) { if (i < lit && bars[i].dataset.on !== '1') { bars[i].style.opacity = '1'; bars[i].style.background = AC; bars[i].dataset.on = '1'; } }
      const nowEl = document.getElementById('auNow'); if (nowEl) nowEl.textContent = auFmt(sec);
      if (el < total) requestAnimationFrame(tick); else resolve();
    };
    requestAnimationFrame(tick);
  });
  revealCta(); await wait(1600); return true;
}

      <div style="text-align:center;"><div id="slideFit" style="font-family:var(--sans);font-size:100px;line-height:1.0;text-transform:uppercase;">${pivot(text,T)}</div>
      ${d.sub?`<div style="margin-top:40px;font-family:var(--serif);font-style:italic;font-size:46px;line-height:1.3;color:${T.dim};">${pivot(d.sub,T)}</div>`:''}</div>
      <div style="text-align:center;font-family:var(--mono);font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:${T.accent};">${esc(d.legend||'La réponse est en légende')}</div>`;
  }else{
    inner=`<div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:26px;">${pastille(112)}
          ${d.pilier?`<div style="font-family:var(--mono);font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:${T.accent};">${esc(d.pilier)}</div>`:''}</div>${num}</div>
      <div><div style="width:140px;height:12px;background:${T.accent};margin-bottom:44px;"></div>
        <div id="slideFit" style="font-family:var(--sans);font-size:112px;line-height:1.0;text-transform:uppercase;letter-spacing:.01em;">${pivot(text,T)}</div>
        ${d.sub?`<div style="margin-top:40px;font-family:var(--serif);font-style:italic;font-size:44px;line-height:1.3;color:${T.dim};">${pivot(d.sub,T)}</div>`:''}</div>
      ${footer('LA BRAISE')}`;
  }
  stage.innerHTML=deco+`<div style="position:absolute;inset:0;padding:96px;display:flex;flex-direction:column;justify-content:space-between;color:${T.text};">`+inner+'</div>';
  const el=document.getElementById('slideFit');
  let fs=parseFloat(getComputedStyle(el).fontSize);
  const avail=v==='cta'?640:(v==='body'?720:760);
  while(el.scrollHeight>avail&&fs>48){fs-=4;el.style.fontSize=fs+'px';}
  return true;
};
