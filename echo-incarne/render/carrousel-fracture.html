<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>H3C — Moteur carrousel « La Fracture » (headless)</title>
<!--
  CARROUSEL — DIRECTION C « LA FRACTURE » (harmonisé avec moteurs/moteur-fracture.html)
  Images fixes 1080×1440 (4:5 utile = 1350px du haut ; couverture lisible dans le
  carré central 1080×1080). Aucune animation. Interface : window.renderSlide(data).
  data = { variant:'cover'|'body'|'cta', text, sub?, pilier?, legend?, eyebrow?,
           index?, total?, handle?, photo?, theme? } — [[mot]] parsé, \n\n = respiration.
  Aperçu : ?d=<data b64> ou ?demo=cover|body|cta &theme=papier &guides=1.
  PROD : vendorer Archivo (500/600/700/900) et IBM Plex Mono en @font-face locales.
-->
<link href="../fonts/echo-incarne-fonts.css" rel="stylesheet"><!-- polices vendorées 2026-07-16 (offline) -->
<style>
  :root{--sans:'Archivo',sans-serif;--mono:'IBM Plex Mono',monospace;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#000;}
  #stage{width:1080px;height:1440px;position:relative;overflow:hidden;}
  .souffle{display:block;height:.55em;}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const THEMES={
  terra:{bg:'#A8432B',text:'#F5EAD9',dim:'rgba(245,234,217,.62)',chip:'#F0E7D6',chipText:'#A8432B',capBg:'#221510',capText:'#F0E7D6',line:'rgba(245,234,217,.28)',ring:'rgba(245,234,217,1)',grainOp:.10,gb:'soft-light'},
  papier:{bg:'#F0E7D6',text:'#221510',dim:'rgba(34,21,16,.55)',chip:'#A8432B',chipText:'#F5EDDD',capBg:'#A8432B',capText:'#F5EDDD',line:'rgba(34,21,16,.22)',ring:'rgba(168,67,43,1)',grainOp:.08,gb:'multiply'},
};
const PHOTO='../uploads/cyrille-novou-new-ok.jpg';
const IGRING='conic-gradient(from 210deg, #FEDA75, #FA7E1E, #D62976, #962FBF, #4F5BD5, #FEDA75)';
const GRAIN='data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22180%22%20height=%22180%22%3E%3Cfilter%20id=%22n%22%3E%3CfeTurbulence%20type=%22fractalNoise%22%20baseFrequency=%220.85%22%20numOctaves=%222%22%20stitchTiles=%22stitch%22%2F%3E%3C%2Ffilter%3E%3Crect%20width=%22100%25%22%20height=%22100%25%22%20filter=%22url%28%23n%29%22%2F%3E%3C%2Fsvg%3E';
const esc=(s='')=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// [[mot]] -> pavé inversé (chip) ; \n\n = respiration, \n = <br>
const pivot=(s,T)=>esc(s)
  .replace(/\[\[([^\]]+)\]\]/g,`<span style="background:${T.chip};color:${T.chipText};padding:.02em .14em;box-decoration-break:clone;-webkit-box-decoration-break:clone;">$1</span>`)
  .replace(/[ \t]*\n(?:[ \t]*\n)+[ \t]*/g,'<span class="souffle"></span>')
  .replace(/[ \t]*\n[ \t]*/g,'<br>');
const num=(i,t)=>String(i??1).padStart(2,'0')+' / '+String(t??9).padStart(2,'0');
const pastille=(size,photo,T)=>`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${IGRING};padding:5px;flex:none;"><div style="width:100%;height:100%;border-radius:50%;background:${T.bg};padding:3px;"><img src="${photo||PHOTO}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;filter:grayscale(1) contrast(1.05);display:block;"></div></div>`;

function buildCover(s,T){
  return `<div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:26px;">${pastille(122,s.photo,T)}
      <div style="background:${T.chip};color:${T.chipText};font-family:var(--sans);font-weight:900;font-size:36px;padding:10px 22px;">H3C</div>
      ${s.pilier?`<div style="font-family:var(--mono);font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:${T.dim};">${esc(s.pilier)}</div>`:''}</div>
    <div style="font-family:var(--mono);font-size:24px;color:${T.dim};">${num(s.index,s.total)}</div></div>
  <div>
    <div class="fitT" style="font-family:var(--sans);font-weight:900;font-size:108px;line-height:.98;letter-spacing:-.02em;text-transform:uppercase;color:${T.text};">${pivot(s.text||'',T)}</div>
  </div>
  <div style="border-top:1px solid ${T.line};padding-top:26px;display:flex;justify-content:space-between;align-items:center;">
    <span style="font-family:var(--mono);font-size:24px;letter-spacing:.14em;color:${T.dim};">${esc(s.handle||'@lecorpsnetrichejamais')}</span>
    <span style="font-family:var(--mono);font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:${T.text};">LA FRACTURE</span></div>`;
}
function buildBody(s,T){
  return `<div style="display:flex;justify-content:space-between;align-items:baseline;">
    <span style="font-family:var(--mono);font-size:25px;letter-spacing:.2em;text-transform:uppercase;color:${T.dim};">${esc(s.eyebrow||'LE SIGNE')}</span>
    <span style="font-family:var(--mono);font-size:24px;color:${T.dim};">${num(s.index,s.total)}</span></div>
  <div>
    <div class="fitT" style="font-family:var(--sans);font-weight:900;font-size:84px;line-height:1.02;letter-spacing:-.02em;text-transform:uppercase;color:${T.text};">${pivot(s.text||'',T)}</div>
    ${s.sub?`<div class="fitS" style="font-family:var(--sans);font-weight:500;font-size:44px;line-height:1.32;color:${T.dim};margin-top:44px;">${pivot(s.sub,T)}</div>`:''}
  </div>
  <div style="border-top:1px solid ${T.line};padding-top:26px;display:flex;justify-content:space-between;align-items:center;">
    <span style="font-family:var(--mono);font-size:24px;letter-spacing:.14em;color:${T.dim};">${esc(s.handle||'·—·—·—·—·—·—·')}</span>
    <span style="font-family:var(--mono);font-size:23px;letter-spacing:.22em;text-transform:uppercase;color:${T.text};">SUITE →</span></div>`;
}
function buildCta(s,T){
  return `<div style="display:flex;justify-content:center;">${pastille(190,s.photo,T)}</div>
  <div style="text-align:center;">
    <div class="fitT" style="font-family:var(--sans);font-weight:900;font-size:92px;line-height:.98;letter-spacing:-.02em;text-transform:uppercase;color:${T.text};">${pivot(s.text||'',T)}</div>
    ${s.sub?`<div class="fitS" style="font-family:var(--sans);font-weight:500;font-size:46px;line-height:1.3;color:${T.dim};margin-top:44px;">${pivot(s.sub,T)}</div>`:''}
  </div>
  <div style="text-align:center;"><span style="display:inline-block;background:${T.capBg};color:${T.capText};font-family:var(--mono);font-size:26px;letter-spacing:.14em;text-transform:uppercase;padding:22px 36px;">${esc(s.legend||'La réponse est en légende')}</span></div>`;
}
const BUILDERS={cover:buildCover,body:buildBody,cta:buildCta};

window.renderSlide=function(data){
  const d=data||{};
  const T=THEMES[d.theme==='papier'?'papier':'terra'];
  const v=d.variant||'body';
  const stage=document.getElementById('stage');
  stage.innerHTML=`
    <div style="position:absolute;inset:0;background:${T.bg}"></div>
    <div style="position:absolute;top:-360px;right:-360px;width:1100px;height:1100px;border-radius:50%;border:3px solid ${T.ring};opacity:.12;"></div>
    <div style="position:absolute;bottom:-280px;left:-280px;width:760px;height:760px;border-radius:50%;border:3px solid ${T.ring};opacity:.08;"></div>
    <div style="position:absolute;inset:-10%;background-image:url(${GRAIN});background-size:190px 190px;opacity:${T.grainOp};mix-blend-mode:${T.gb};"></div>
    <div id="content" style="position:absolute;inset:0;padding:96px;display:flex;flex-direction:column;justify-content:space-between;color:${T.text};">${(BUILDERS[v]||buildBody)(d,T)}</div>
    ${d.guides?`<div style="position:absolute;inset:0;pointer-events:none;font-family:var(--mono);color:rgba(255,240,90,.95);">
      <div style="position:absolute;left:0;right:0;top:1350px;border-top:2px dashed rgba(255,240,90,.75)"></div>
      <div style="position:absolute;left:0;right:0;top:180px;border-top:2px dashed rgba(255,240,90,.45)"></div>
      <div style="position:absolute;left:0;right:0;top:1260px;border-top:2px dashed rgba(255,240,90,.45)"></div>
      <div style="position:absolute;top:1356px;left:24px;font-size:22px;">coupe feed 4:5</div>
      <div style="position:absolute;top:186px;left:24px;font-size:22px;opacity:.7;">carré profil 1080²</div>
    </div>`:''}`;
  const c=document.getElementById('content');
  let guard=0;
  while(c.scrollHeight>c.clientHeight&&guard++<60){
    ['.fitT','.fitS'].forEach(sel=>{const el=c.querySelector(sel);if(el){const fs=parseFloat(getComputedStyle(el).fontSize);if(fs>34)el.style.fontSize=(fs-4)+'px';}});
  }
  return true;
};

const DEMOS={
  cover:{variant:'cover',pilier:'Le mécanisme',text:"VOUS CROYEZ QUE VOUS L'AIMEZ, LUI. EN VÉRITÉ, VOUS AIMEZ LA [[BLESSURE]] QU'IL RÉVEILLE.",index:1,total:10},
  body:{variant:'body',text:'UN HOMME PRÉSENT, STABLE, DISPONIBLE, ET VOUS VOUS [[ENNUYEZ]].',sub:"VOUS APPELEZ ÇA « PAS D'ALCHIMIE ».",index:3,total:10},
  cta:{variant:'cta',text:'LA TÊTE COMPREND TOUT ÇA. LE CORPS, LUI, RÉPARE.',sub:'LA PREMIÈRE MARCHE VOUS ATTEND EN [[LÉGENDE]].',legend:'La réponse est en légende',index:10,total:10},
};
(function(){
  const q=new URLSearchParams(location.search);
  let d=null;
  try{if(q.get('d'))d=JSON.parse(decodeURIComponent(escape(atob(q.get('d')))));}catch(e){}
  d=d||Object.assign({},DEMOS[q.get('demo')||'cover']||DEMOS.cover);
  if(q.get('theme'))d.theme=q.get('theme');
  if(q.get('guides')==='1')d.guides=true;
  window.renderSlide(d);
})();
</script>
</body>
</html>
