<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>H3C — Moteur carrousel « Le Manifeste » (headless)</title>
<!--
  CARROUSEL — DIRECTION B « LE MANIFESTE » (harmonisé avec moteurs/moteur-manifeste.html)
  Images fixes 1080×1440 (4:5 utile = 1350px du haut ; couverture lisible dans le
  carré central 1080×1080). Aucune animation. Interface : window.renderSlide(data).
  data = { variant:'cover'|'body'|'cta', text, sub?, pilier?, legend?, eyebrow?,
           index?, total?, handle?, photo?, theme? } — [[mot]] parsé, \n\n = respiration.
  Aperçu : ?d=<data b64> ou ?demo=cover|body|cta &theme=nuit &guides=1.
  PROD : vendorer Cormorant Garamond, Archivo, IBM Plex Mono en @font-face locales.
-->
<link href="../fonts/echo-incarne-fonts.css" rel="stylesheet"><!-- polices vendorées 2026-07-16 (offline) -->
<style>
  :root{--serif:'Cormorant Garamond',serif;--sans:'Archivo',sans-serif;--mono:'IBM Plex Mono',monospace;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#000;}
  #stage{width:1080px;height:1440px;position:relative;overflow:hidden;}
  .souffle{display:block;height:.55em;}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const THEMES={
  papier:{bg:'#F0E7D6',text:'#261D14',dim:'rgba(38,29,20,.55)',accent:'#A8432B',glow:'rgba(255,248,235,.85)',line:'rgba(38,29,20,.25)',grainOp:.10,gb:'multiply'},
  nuit:{bg:'#1B1510',text:'#F0E7D6',dim:'rgba(240,231,214,.55)',accent:'#D9714E',glow:'rgba(168,67,43,.42)',line:'rgba(240,231,214,.25)',grainOp:.16,gb:'soft-light'},
};
const PHOTO='../uploads/cyrille-novou-new-ok.jpg';
const IGRING='conic-gradient(from 210deg, #FEDA75, #FA7E1E, #D62976, #962FBF, #4F5BD5, #FEDA75)';
const GRAIN='data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22180%22%20height=%22180%22%3E%3Cfilter%20id=%22n%22%3E%3CfeTurbulence%20type=%22fractalNoise%22%20baseFrequency=%220.85%22%20numOctaves=%222%22%20stitchTiles=%22stitch%22%2F%3E%3C%2Ffilter%3E%3Crect%20width=%22100%25%22%20height=%22100%25%22%20filter=%22url%28%23n%29%22%2F%3E%3C%2Fsvg%3E';
const esc=(s='')=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// [[mot]] -> italique terracotta surligné (coup de marqueur, statique) ; \n\n = respiration
const pivot=(s,T)=>esc(s)
  .replace(/\[\[([^\]]+)\]\]/g,`<span style="font-style:italic;color:${T.accent};background-image:linear-gradient(transparent 66%, ${T.accent}33 66%);">$1</span>`)
  .replace(/[ \t]*\n(?:[ \t]*\n)+[ \t]*/g,'<span class="souffle"></span>')
  .replace(/[ \t]*\n[ \t]*/g,'<br>');
const BRAND=(T)=>`<span style="color:${T.accent}">SOUVERAIN</span>AU<span style="color:${T.accent}">QUOTIDIEN</span>.COM`;
const num=(i,t)=>String(i??1).padStart(2,'0')+' / '+String(t??9).padStart(2,'0');
const pastille=(size,photo,T)=>`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${IGRING};padding:5px;flex:none;"><div style="width:100%;height:100%;border-radius:50%;background:${T.bg};padding:3px;"><img src="${photo||PHOTO}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;filter:grayscale(1) contrast(1.02);display:block;"></div></div>`;
// écho : la rangée de points qui s'assombrit vers le terracotta (héritage Écho Incarné)
const echoDots=(T)=>`<div style="display:flex;gap:22px;align-items:center;margin-bottom:56px;">
  ${[.08,.16,.30,.52].map(o=>`<span style="width:42px;height:42px;border-radius:50%;background:${T.text};opacity:${o}"></span>`).join('')}
  <span style="width:42px;height:42px;border-radius:50%;background:#8C6A4A;opacity:.8"></span>
  <span style="width:42px;height:42px;border-radius:50%;background:${T.accent}"></span></div>`;

function buildCover(s,T){
  return `<div style="display:flex;justify-content:space-between;align-items:flex-start;">
    <div><div style="font-family:var(--mono);font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:${T.dim};">${BRAND(T)}</div>
      <div style="font-family:var(--mono);font-size:24px;color:${T.dim};margin-top:16px;">${num(s.index,s.total)}</div></div>
    ${pastille(196,s.photo,T)}</div>
  <div>
    ${s.pilier?`<div style="font-family:var(--mono);font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:${T.accent};margin-bottom:44px;">${esc(s.pilier)}</div>`:''}
    <div class="fitT" style="font-family:var(--serif);font-weight:600;font-size:106px;line-height:1.04;letter-spacing:-.015em;color:${T.text};">${pivot(s.text||'',T)}</div>
  </div>
  <div>${echoDots(T)}
    <div style="border-top:1px solid ${T.line};padding-top:26px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-family:var(--mono);font-size:24px;letter-spacing:.14em;color:${T.dim};">${esc(s.handle||'@lecorpsnetrichejamais')}</span>
      <span style="font-family:var(--sans);font-weight:600;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:${T.accent};">H3C</span></div></div>`;
}
function buildBody(s,T){
  return `<div style="display:flex;justify-content:space-between;align-items:baseline;">
    <span style="font-family:var(--mono);font-size:25px;letter-spacing:.2em;text-transform:uppercase;color:${T.accent};">${esc(s.eyebrow||'Le signe')}</span>
    <span style="font-family:var(--mono);font-size:24px;color:${T.dim};">${num(s.index,s.total)}</span></div>
  <div>
    <div class="fitT" style="font-family:var(--serif);font-weight:500;font-size:76px;line-height:1.16;letter-spacing:-.01em;color:${T.text};">${pivot(s.text||'',T)}</div>
    ${s.sub?`<div class="fitS" style="font-family:var(--sans);font-size:44px;line-height:1.4;color:${T.dim};margin-top:44px;">${pivot(s.sub,T)}</div>`:''}
  </div>
  <div style="border-top:1px solid ${T.line};padding-top:26px;display:flex;justify-content:space-between;align-items:center;">
    <span style="font-family:var(--mono);font-size:24px;letter-spacing:.14em;color:${T.dim};">${esc(s.handle||'·—·—·—·—·—·—·')}</span>
    <span style="font-family:var(--sans);font-weight:600;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:${T.dim};">Suite →</span></div>`;
}
function buildCta(s,T){
  return `<div style="font-family:var(--mono);font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:${T.dim};text-align:center;">${BRAND(T)}</div>
  <div style="text-align:center;display:flex;flex-direction:column;align-items:center;">
    <div style="margin-bottom:52px;">${pastille(200,s.photo,T)}</div>
    <div class="fitT" style="font-family:var(--serif);font-weight:600;font-size:88px;line-height:1.08;letter-spacing:-.015em;color:${T.text};">${pivot(s.text||'',T)}</div>
    ${s.sub?`<div class="fitS" style="font-family:var(--serif);font-style:italic;font-size:48px;line-height:1.3;color:${T.dim};margin-top:40px;">${pivot(s.sub,T)}</div>`:''}
  </div>
  <div style="text-align:center;font-family:var(--mono);font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:${T.accent};">${esc(s.legend||'La réponse est en légende')}</div>`;
}
const BUILDERS={cover:buildCover,body:buildBody,cta:buildCta};

window.renderSlide=function(data){
  const d=data||{};
  const T=THEMES[d.theme==='nuit'?'nuit':'papier'];
  const v=d.variant||'body';
  const stage=document.getElementById('stage');
  stage.innerHTML=`
    <div style="position:absolute;inset:0;background:${T.bg}"></div>
    <div style="position:absolute;inset:-20%;background:radial-gradient(circle at 50% 40%, ${T.glow}, transparent 62%);"></div>
    <div style="position:absolute;inset:-10%;background-image:url(${GRAIN});background-size:190px 190px;opacity:${T.grainOp};mix-blend-mode:${T.gb};"></div>
    <div id="content" style="position:absolute;inset:0;padding:96px;display:flex;flex-direction:column;justify-content:space-between;color:${T.text};">${(BUILDERS[v]||buildBody)(d,T)}</div>
    ${d.guides?`<div style="position:absolute;inset:0;pointer-events:none;font-family:var(--mono);color:rgba(255,84,60,.9);">
      <div style="position:absolute;left:0;right:0;top:1350px;border-top:2px dashed rgba(255,84,60,.7)"></div>
      <div style="position:absolute;left:0;right:0;top:180px;border-top:2px dashed rgba(200,140,40,.6)"></div>
      <div style="position:absolute;left:0;right:0;top:1260px;border-top:2px dashed rgba(200,140,40,.6)"></div>
      <div style="position:absolute;top:1356px;left:24px;font-size:22px;">coupe feed 4:5</div>
      <div style="position:absolute;top:186px;left:24px;font-size:22px;color:rgba(200,140,40,.9);">carré profil 1080²</div>
    </div>`:''}`;
  const c=document.getElementById('content');
  let guard=0;
  while(c.scrollHeight>c.clientHeight&&guard++<60){
    ['.fitT','.fitS'].forEach(sel=>{const el=c.querySelector(sel);if(el){const fs=parseFloat(getComputedStyle(el).fontSize);if(fs>34)el.style.fontSize=(fs-4)+'px';}});
  }
  return true;
};

const DEMOS={
  cover:{variant:'cover',pilier:'Le mécanisme',text:"VOUS CROYEZ QUE VOUS L'AIMEZ, LUI. EN VÉRITÉ, VOUS AIMEZ LA [[BLESSURE]] QU'IL RÉVEILLE.",index:1,total:10},
  body:{variant:'body',text:'UN HOMME PRÉSENT, STABLE, DISPONIBLE, ET VOUS VOUS [[ENNUYEZ]].',sub:"VOUS APPELEZ ÇA « PAS D'ALCHIMIE ».",index:3,total:10},
  cta:{variant:'cta',text:'LA TÊTE COMPREND TOUT ÇA. LE CORPS, LUI, RÉPARE.',sub:'LA PREMIÈRE MARCHE VOUS ATTEND EN [[LÉGENDE]].',legend:'La réponse est en légende',index:10,total:10},
};
(function(){
  const q=new URLSearchParams(location.search);
  let d=null;
  try{if(q.get('d'))d=JSON.parse(decodeURIComponent(escape(atob(q.get('d')))));}catch(e){}
  d=d||Object.assign({},DEMOS[q.get('demo')||'cover']||DEMOS.cover);
  if(q.get('theme'))d.theme=q.get('theme');
  if(q.get('guides')==='1')d.guides=true;
  window.renderSlide(d);
})();
</script>
</body>
</html>
